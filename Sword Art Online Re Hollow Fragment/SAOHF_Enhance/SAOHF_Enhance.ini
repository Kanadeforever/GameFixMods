[Main]
; 是否恢复“技能消耗方式（CD制/SP制）”菜单与实际机制。
; v0.3 不再限定繁中，英文/繁中/简中等语言分支都会启用这套机制。
EnableCdSpSwitch=1

; 是否让非日文语言使用英文版的 UI 确定/取消布局。
; 目标：South/A = 确定，East/B = 取消；日文仍保持原始布局。
UseEnglishOkCancelLayout=1

; 是否启用内存虚拟 localize_msg.dat 文本补全。
; 该项不修改 SAOHF.exe，也不修改本地 localize_msg.dat。
EnableVirtualTextPatch=1

; 是否给繁中 cht/common/msg/localize_msg.dat 虚拟补全 CD/SP 文本。
PatchChtText=1

; 是否给英文 usa/common/msg/localize_msg.dat 虚拟补全 CD/SP 文本。
PatchUsaText=1

; 是否输出 SAOHF_Enhance.log。
EnableLog=1
