; BALDR SKY Steam Win11 兼容层 v0.1-t9
; ================================================================
; 默认值只开启已经确认有效、或用户明确要求默认启用的兼容功能。
; 修改 INI 后重新启动游戏即可生效。

[Compatibility]
; 修复 Steam 移植 .patch 的三个已确认错误。
; 中英文 Steam EXE 使用同一套语义签名，不依赖固定地址。
; 1 = 开启，0 = 关闭。
EnableSteamFix=1

; 自动维护：
; HKCU\Software\Microsoft\Direct3D\Shims\EnableOverlays
; 当前 BaldrSky.exe 完整路径对应的 DWORD = 0。
; 用于修复老式视频“有声音但画面黑屏”。
; 英文版 test8 已实机确认该值会被兼容层正确创建/维持为 0。
EnableVideoOverlayFix=1

; 高 DPI 缩放兼容。
; 1 = 默认开启：把 BALDR SKY 设为 System DPI Aware，关闭 Windows 传统 DPI 虚拟化。
; 0 = 完全不修改进程 DPI awareness，交给 Windows / 外部兼容设置决定。
;
; 这里故意使用 System DPI Aware，而不是 Per-Monitor V2：
; BALDR SKY 是 2009 年固定像素 UI，没有为 WM_DPICHANGED / 跨显示器 DPI 动态切换设计。
EnableHighDpiFix=1

[Graphics]
; D3D9 后端：
; 0 = 自动：优先加载本兼容层同目录 d3d9_backend.dll；没有则使用 Windows 原生 D3D9。
; 1 = 强制 Windows 原生 D3D9。
; 2 = 强制同目录 d3d9_backend.dll；加载失败时不回退。
Backend=0

[Diagnostics]
; 1 = 写 d3d9.log；0 = 不写日志。
; 默认设置不开启日志，如果遇到了崩溃或者别的BUG，请把下面的选项改成“1”
; 然后再次运行游戏，并将生成的“d3d9.dll”提交给作者。
EnableLog=0

; 0 = 仅错误
; 1 = 基本信息
; 2 = 详细信息（默认）
; 3 = 调试信息
LogLevel=3

; 1 = 安装轻量 VEH/VCH，只记录异常，不吞异常。
; 0 = 不安装。
;
; test8 已观察到英文版/图形后端可能产生“程序自己能处理”的 first-chance 异常。
; 为避免正式候选日志把这类可恢复异常误报成真实崩溃，test9 默认关闭。
; 后续如果真的发生退出/崩溃，再临时改成 1 获取现场即可。
EnableCrashDiagnostics=0

; 视频 Overlay 守护线程检查间隔，单位毫秒。
; 它只查询当前游戏对应的一条 HKCU 注册表值；只有被改回非 0 时才写入。
OverlayGuardIntervalMs=500
