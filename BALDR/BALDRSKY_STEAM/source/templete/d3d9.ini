; BALDR SKY Steam Win11 兼容层 v0.1-t14
; ================================================================
;
; 默认不生成日志。遇到问题时只需要把 EnableLog 改成 1，

[Compatibility]
; Steam 原 install.vdf 会强制写入：~ DPIUNAWARE VISTARTM。
; 1 = 静默移除 install.vdf 中对应 AppCompatFlags\Layers 子块，
;     并清理当前 BaldrSky.exe 注册表值中的 DPIUNAWARE / VISTARTM。
;     已经修过时零操作；Steam 更新/验证恢复后，下次启动会再次静默修复。
;     如果 install.vdf 整个文件缺失，只按游戏语言提示“验证完整性”，然后继续游戏。
; 0 = 完全不修改 install.vdf / AppCompatFlags\Layers。
EnableSteamInstallScriptFix=1

; 高 DPI 缩放兼容。
; 1 = System DPI Aware，关闭 Windows 传统 DPI 虚拟化；
; 0 = 不主动修改 DPI awareness。
EnableHighDpiFix=1

[Graphics]
; D3D9 后端：
; 0 = 自动：优先加载兼容层同目录 d3d9_backend.dll；
;           没有则使用 Windows 原生 D3D9。
; 1 = 强制 Windows 原生 D3D9。
; 2 = 强制同目录 d3d9_backend.dll；加载失败时不回退。
Backend=0

; ReShade 链式加载：
; 0 = 不加载 ReShade。
; 1 = 加载同目录的 ReShade32.dll。
;
; 安装方式：把 ReShade 6.7+ 的 32 位 DLL 保持/改名为 ReShade32.dll 放在游戏目录。
; 兼容层会在 ReShade 加载前自动填写 ReShade 配置文件的 [PROXY] 字段。
; 除这个 [PROXY] 外，不修改用户的 ReShade preset/shader/input 等配置。
; ReShade32.dll 缺失或加载失败时会自动回退到普通 D3D9 后端，不阻止游戏启动。
EnableReShade=0

[Diagnostics]
; 0 = 不生成日志。
; 1 = 生成日志：d3d9.log
;     普通用户遇到问题时通常只需要把这一项改成 1。
EnableLog=0

; 日志详细程度：
; 0 = 仅错误；1 = 基本信息；2 = 详细信息；3 = 调试信息（默认）
LogLevel=3

; PixelBoundaryFix 的核心应急回退不受此项和 EnableLog 影响：
; 如果内联补丁安装失败，兼容层仍会自动启用精确恢复。
; 1 = EnableLog=1 时，同时记录普通 Access Violation 的完整 VEH/VCH 现场。
; 0 = 只写普通运行日志，不安装纯诊断 VEH/VCH。
EnableCrashDiagnostics=1
